<img id="img-plain" alt="مرسيدس فئة S" src="/AB_LOGO-NEW.png">

<script>
function googleTranslateElementInit(){
  new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'ar',layout:'SIMPLE'},'google_translate_element');
}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
var tries=0;
var iv=setInterval(function(){
  var c=document.querySelector('.goog-te-combo');
  if(c){c.value='ar';c.dispatchEvent(new Event('change',{bubbles:true}));clearInterval(iv);}
  if(++tries>60)clearInterval(iv);
},250);
</script>
